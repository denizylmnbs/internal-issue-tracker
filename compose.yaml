services:
  postgres:
    image: 'postgres:17'
    container_name: 'issue-tracker-db'
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: 'redis:8.2-alpine'
    container_name: 'issue-tracker-redis'
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis_data:/data
  kafka:
    image: 'apache/kafka:4.1.0'
    container_name: 'issue-tracker-kafka'
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'

      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka_data:/var/lib/kafka/data
  minio:
    image: 'minio/minio:latest'
    container_name: 'issue-tracker-minio'
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/data
  clamav:
    image: 'clamav/clamav:1.4'
    container_name: 'issue-tracker-clamav'
    ports:
      - '${CLAMAV_PORT:-3310}:3310'
    # Persisting the signature database is what keeps this a one-time cost: without the volume
    # every `compose up` re-downloads it and clamd refuses connections for minutes each time.
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      # Long enough to cover that first download so the container is not marked unhealthy while
      # it is doing exactly what it should be doing.
      start_period: 180s

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  clamav_data: