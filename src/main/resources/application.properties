spring.application.name=Internal Issue Tracker
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Pin the database session's time zone instead of inheriting the JVM's, which is what the driver does
# by default. It matters because date_trunc cuts a timestamptz in the *session's* zone: on a machine
# at +03 a monthly bucket starts at 2026-04-01T00:00+03, which the metric responses then render as
# 2026-03-31T21:00Z - a bucket labelled with the wrong month. Without this the same data buckets
# differently on a developer's laptop and on a server, and neither agrees with the UTC window echoed
# back beside it. See ThroughputBucket.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# event_publication is created by V1, verbatim from the Modulith docs, so Modulith must not run its
# own DDL for it - Flyway owns every table in this schema.
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Drop the publication row once the event has reached the broker. The table is an outbox now: what
# was published is on the topic, and Kafka keeps it for its retention period regardless.
spring.modulith.events.completion-mode=DELETE
# Hand back whatever had not reached the broker when the process died. With the row written in the
# publishing transaction, this is what makes a broker being down a delay rather than a lost event.
spring.modulith.events.republish-outstanding-events-on-restart=true
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# The outbox may only delete a publication for a record the broker has durably taken; idempotence
# keeps the producer's own retries from writing it twice.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Auto-commit advances the offset on a timer, not on success - a listener that throws would have its
# record marked read and the activity row silently lost. Commit after the listener returns instead.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Only applies to a group with no committed offset, so a consumer added later rebuilds from the whole
# topic rather than starting blank. The listeners deduplicate, so a replay costs nothing.
spring.kafka.consumer.auto-offset-reset=earliest
# occurredAt must stay an ISO-8601 string: as an epoch number it loses its offset and no longer
# equals what the publisher stamped, breaking the equality the listeners deduplicate on. In Jackson 3
# WRITE_DATES_AS_TIMESTAMPS is a DateTimeFeature, hence the datatype.datetime key.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false
spring.mvc.problemdetails.enabled=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0
app.cache.default-ttl=PT15M
# Shorter than the general default: metric results are expensive to recompute but read-only and
# non-security-sensitive, so a bounded staleness window stands in for active cache eviction. See
# RedisConfig.METRICS_CACHE_NAMES.
app.cache.metrics-ttl=PT5M
# Short: this is a safety net behind active eviction, not the primary invalidation - a stale entry
# here is a stale authorization grant. See RedisConfig.AUTH_CACHE_NAMES.
app.cache.auth-ttl=PT2M
# Origins the browser frontend is served from, comma-separated. Not a wildcard: allowCredentials
# forbids "*", and the CORS contract is a list of trusted origins rather than a formality. Override
# per environment with CORS_ALLOWED_ORIGINS; the default is a local Next.js dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
# Endpoint this backend reaches MinIO through - inside compose.yaml that's the service name, not
# localhost. Kept separate from public-endpoint below because the two are not interchangeable: see
# StorageConfig.
app.storage.endpoint=${MINIO_ENDPOINT:http://localhost:${MINIO_PORT:9000}}
# Endpoint presigned URLs are signed for - what the *browser* reaches MinIO through. The SigV4
# signature covers the Host header, so a URL signed for one endpoint cannot be rewritten to another
# afterwards; defaults to app.storage.endpoint for the common case where backend and browser reach
# MinIO the same way (local dev).
app.storage.public-endpoint=${MINIO_PUBLIC_ENDPOINT:${app.storage.endpoint}}
app.storage.access-key=${MINIO_ROOT_USER}
app.storage.secret-key=${MINIO_ROOT_PASSWORD}
# MinIO ignores the region value but the SDK requires one to be set.
app.storage.region=${MINIO_REGION:us-east-1}
# Must be DNS-compliant lowercase - MinIO rejects CreateBucket otherwise.
app.storage.bucket=${MINIO_BUCKET:issue-tracker}
# Long enough that a leaked URL is a minor exposure (one low-value internal avatar, one hour) rather
# than something users hit constantly - Radix's AvatarImage falls back to initials on an expired
# URL, so the failure mode is graceful either way. See UserMapper.
app.storage.presigned-url-ttl=PT1H
# Off in production: the bucket there is provisioned by ops and this app's credentials won't carry
# s3:CreateBucket. See BucketInitializer.
app.storage.auto-create-bucket=true
# Hard cap on avatar uploads; UserAvatarService re-checks the same number so the rule is testable
# without a servlet container, but this is what actually stops oversize bytes at the wire.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Decoded-pixel guards, which the byte cap above cannot express: a 2MB PNG may legitimately declare
# 30000x30000 and decode into gigabytes. ImageNormalizer checks these against the header before
# allocating anything. max-pixels is 4096^2; peak transient cost is roughly 4 bytes per pixel, so
# this admits ~64MB per concurrent upload - bounded in turn by RateLimiterService.perUpload().
app.storage.image.max-dimension=4096
app.storage.image.max-pixels=16777216
# Off means avatars are stored without ever being scanned for malware. Only turn it off knowingly -
# the usual reason is skipping clamd's multi-minute first-run signature download on a dev machine.
app.storage.av.enabled=${STORAGE_AV_ENABLED:true}
app.storage.av.host=${CLAMAV_HOST:localhost}
app.storage.av.port=${CLAMAV_PORT:3310}
# Covers connect and read. Generous because a cold clamd can be slow, but bounded because an
# unreachable scanner fails the upload closed - see UserAvatarService.
app.storage.av.timeout=PT10S
# Reverse-proxy addresses whose X-Forwarded-For header may be believed, comma-separated. Empty by
# default so an unset value cannot be exploited: anyone can send that header, and honoring it
# blindly lets a client rotate its own rate-limit bucket key at will. Behind a proxy in production
# this MUST list the proxy's address, otherwise every unauthenticated request shares one bucket.
app.security.trusted-proxies=${TRUSTED_PROXIES:}