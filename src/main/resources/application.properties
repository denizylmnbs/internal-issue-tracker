spring.application.name=Internal Issue Tracker
spring.config.import=optional:file:.env[.properties]
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Pin the database session's time zone instead of inheriting the JVM's, which is what the driver does
# by default. It matters because date_trunc cuts a timestamptz in the *session's* zone: on a machine
# at +03 a monthly bucket starts at 2026-04-01T00:00+03, which the metric responses then render as
# 2026-03-31T21:00Z - a bucket labelled with the wrong month. Without this the same data buckets
# differently on a developer's laptop and on a server, and neither agrees with the UTC window echoed
# back beside it. See ThroughputBucket.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'
# event_publication is created by V1, verbatim from the Modulith docs, so Modulith must not run its
# own DDL for it - Flyway owns every table in this schema.
spring.modulith.events.jdbc.schema-initialization.enabled=false
# Drop the publication row once the event has reached the broker. The table is an outbox now, not a
# record of anything: what was published is on the topic, and Kafka keeps it for its retention period
# whether or not anyone has read it. Keeping completed rows here would be a second copy that only
# grows.
spring.modulith.events.completion-mode=DELETE
# Hand back whatever had not reached the broker when the process died. Together with the row being
# written in the publishing transaction, this is what makes "committed to the database" and "sent to
# Kafka" the same decision: a broker that is down delays an event, it does not lose it.
spring.modulith.events.republish-outstanding-events-on-restart=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# acks=all: the send is only successful once every in-sync replica has the record. Weaker settings
# would let the outbox delete a publication for a record the broker had not durably taken, which is
# exactly the case the outbox exists to prevent. Idempotence stops the producer's own retries from
# writing that record twice.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# With auto-commit on, the offset advances on a timer and not on success: a listener that throws
# would have its record marked as read anyway, and the activity row would simply never be written.
# ack-mode=record commits after the listener returns, so a failure is redelivered instead.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Only applies to a group with no committed offset - a brand new consumer, or one whose offsets have
# aged out. earliest so that a consumer added later rebuilds from the whole topic rather than
# starting blank; the listeners deduplicate, so replaying what they already have costs nothing.
spring.kafka.consumer.auto-offset-reset=earliest
# occurredAt has to stay an ISO-8601 string on the wire. As epoch numbers it loses its offset, and
# the value that comes back no longer equals the one the publisher stamped - which silently breaks
# the timestamp equality the activity listeners deduplicate on. Stated rather than left to the
# default because the cost of the default changing under us is silent duplicate rows. Note the key:
# in Jackson 3 WRITE_DATES_AS_TIMESTAMPS is a DateTimeFeature, not a SerializationFeature, so it
# binds under spring.jackson.datatype.datetime and nowhere else.
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

spring.mvc.problemdetails.enabled=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

app.cache.default-ttl=PT15M
# Shorter than the general default: metric results are expensive to recompute but read-only and
# non-security-sensitive, so a bounded staleness window stands in for active cache eviction. See
# RedisConfig.METRICS_CACHE_NAMES.
app.cache.metrics-ttl=PT5M
# Short: this is a safety net behind active eviction, not the primary invalidation - a stale entry
# here is a stale authorization grant. See RedisConfig.AUTH_CACHE_NAMES.
app.cache.auth-ttl=PT2M

# Origins the browser frontend is served from, comma-separated. Not a wildcard: allowCredentials
# forbids "*", and the CORS contract is a list of trusted origins rather than a formality. Override
# per environment with CORS_ALLOWED_ORIGINS; the default is a local Next.js dev server.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}