# Keeps Kafka out of the test context. There is no broker in a test run any more than there is a
# database, and without these every context that starts spends its time retrying a connection to
# localhost:9092 and logging the failure.
#
# Nothing here weakens a test. No test asserts on externalization or on a consumer: the listeners
# only translate an event into a row, and the mapping they do - the toActionType switches, the
# change detection that decides what gets published at all - is covered by the plain unit tests.
spring.modulith.events.externalization.enabled=false
spring.kafka.listener.auto-startup=false
